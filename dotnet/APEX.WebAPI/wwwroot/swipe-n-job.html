<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swipe n' Job | APEX by AVERS — Live Reels & Matching Emploi</title>
    <meta name="description" content="Découvrez les offres d'emploi en format Live Reel immersif avec avis entreprise, score de compatibilité IA et candidature express.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --brand: #f97316;
            --brand-hover: #ea580c;
            --brand-glow: rgba(249, 115, 22, 0.45);
            --brand-dim: rgba(249, 115, 22, 0.14);
            --bg: #09090b;
            --surface: rgba(18, 18, 24, 0.85);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-card: rgba(14, 14, 20, 0.72);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
            --radius-pill: 100px;
            --radius-card: 22px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, sans-serif;
            overflow: hidden;
            height: 100dvh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── CANVAS PARTICLES ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.22;
            pointer-events: none;
        }

        /* ── LOADING OVERLAY ── */
        #loading-overlay {
            position: fixed; inset: 0;
            background: #060608;
            z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px;
            transition: opacity 0.4s ease;
        }
        .loader-ring {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: var(--brand);
            border-right-color: #fb923c;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        }
        .loader-text {
            font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }

        /* ── HEADER ── */
        .apex-header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 12px 18px;
            display: flex; align-items: center; gap: 12px;
            background: linear-gradient(to bottom, rgba(5,5,8,0.92) 0%, rgba(5,5,8,0.4) 75%, transparent 100%);
            backdrop-filter: blur(14px);
            transition: transform 0.3s;
        }

        .btn-header-round {
            width: 44px; height: 44px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .btn-header-round:hover {
            background: rgba(255,255,255,0.18);
            transform: scale(1.06);
        }

        /* ── SEARCH BAR ── */
        .search-wrap {
            flex: 1;
            position: relative;
            max-width: 460px;
            margin: 0 auto;
        }

        .search-inner {
            display: flex; align-items: center; gap: 10px;
            background: rgba(18, 18, 24, 0.82);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            padding: 0 8px 0 16px;
            height: 44px;
            transition: all 0.25s;
        }
        .search-inner:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-dim);
            background: rgba(22, 22, 30, 0.95);
        }
        .search-inner i.search-icon { color: rgba(255,255,255,0.45); flex-shrink: 0; }
        .search-inner input {
            flex: 1; background: transparent; border: none;
            color: #fff; outline: none;
            font-size: 13.5px; font-weight: 500;
            font-family: inherit;
        }
        .search-inner input::placeholder { color: rgba(255,255,255,0.4); }

        .btn-clear {
            background: rgba(255,255,255,0.1);
            border: none; color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .btn-clear.visible { display: flex; }
        .btn-search {
            background: var(--brand);
            border: none; color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.2s;
        }
        .btn-search:hover { transform: scale(1.08); background: var(--brand-hover); }

        /* ── AUTOCOMPLETE SUGGEST ── */
        .suggest-portal {
            position: absolute;
            top: calc(100% + 8px);
            left: 0; right: 0;
            background: rgba(16, 16, 22, 0.96);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0,0,0,0.7);
            display: none;
            z-index: 120;
        }
        .suggest-portal.open { display: block; }
        .suggest-header {
            padding: 10px 16px 4px;
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--brand);
        }
        .suggest-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13.5px; font-weight: 500;
            color: rgba(255,255,255,0.85);
            transition: background 0.15s;
        }
        .suggest-item:hover { background: var(--brand-dim); color: #fff; }
        .suggest-item .match { color: var(--brand); font-weight: 700; }

        /* ── FILTER ROW ── */
        .filter-row {
            position: fixed;
            top: 68px; left: 0; right: 0;
            z-index: 90;
            padding: 0 18px 8px;
            display: flex; gap: 8px;
            overflow-x: auto; scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar { display: none; }

        .chip {
            background: rgba(18, 18, 24, 0.7);
            border: 1px solid var(--glass-border);
            color: rgba(255,255,255,0.85);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            font-size: 11.5px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
            transition: all 0.2s;
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }
        .chip:hover { background: rgba(255,255,255,0.15); }
        .chip.active {
            background: var(--brand);
            border-color: var(--brand);
            box-shadow: 0 4px 14px var(--brand-glow);
            color: #fff;
        }

        /* ── REEL VIEWPORT (VERTICAL TIKTOK SCROLL) ── */
        #reel-viewport {
            position: relative; z-index: 10;
            height: 100dvh; width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        #reel-viewport::-webkit-scrollbar { display: none; }

        /* ── REEL UNIT ── */
        .reel-unit {
            height: 100dvh; width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex; align-items: flex-end;
            overflow: hidden;
        }

        .reel-bg {
            position: absolute; inset: 0; z-index: 0;
            overflow: hidden;
            background: #09090c;
        }
        .reel-bg video, .reel-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.38) contrast(1.1);
            will-change: transform;
            transform: scale(1.04);
            transition: transform 1.2s ease-out;
        }
        .reel-unit.active .reel-bg img {
            animation: panZoom 18s linear infinite alternate;
        }
        @keyframes panZoom {
            0%   { transform: scale(1.04) translate(0, 0); }
            100% { transform: scale(1.15) translate(-1%, 2%); }
        }

        .aurora-ambient {
            position: absolute; inset: 0;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.65;
            animation: pulseAurora 6s ease-in-out infinite alternate;
        }
        @keyframes pulseAurora {
            0% { opacity: 0.45; }
            100% { opacity: 0.75; }
        }

        .reel-overlay {
            position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to top,
                rgba(5,5,8,0.98) 0%,
                rgba(5,5,8,0.68) 32%,
                rgba(5,5,8,0.2) 65%,
                transparent 100%);
            pointer-events: none;
        }

        /* ── STORY SEGMENTS TOP PROGRESS ── */
        .story-progress-bar {
            position: absolute;
            top: 6px; left: 16px; right: 16px;
            z-index: 30;
            display: flex; gap: 6px;
            height: 3px;
        }
        .story-seg {
            flex: 1;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
            overflow: hidden;
        }
        .story-seg.active {
            background: var(--brand);
            box-shadow: 0 0 8px var(--brand-glow);
        }

        /* ── TOP BADGES ── */
        .top-meta-badge {
            position: absolute;
            top: 116px; left: 20px;
            z-index: 25;
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }
        .live-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: rgba(14, 14, 20, 0.75);
            border: 1px solid;
            font-size: 11px; font-weight: 800;
            backdrop-filter: blur(10px);
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .live-dot {
            width: 7px; height: 7px; border-radius: 50%;
            animation: blinkDot 1.4s infinite;
        }
        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .match-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(249,115,22,0.25));
            border: 1px solid rgba(168,85,247,0.4);
            font-size: 11px; font-weight: 800;
            color: #e9d5ff;
            backdrop-filter: blur(10px);
        }

        /* ── REEL BODY CONTENT ── */
        .reel-body {
            position: relative; z-index: 20;
            width: 100%;
            padding: 0 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
        }

        .job-meta {
            flex: 1; min-width: 0;
            max-width: 520px;
        }

        .job-company {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .company-badge-avatar {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .company-name {
            font-size: 13px; font-weight: 800;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .job-title {
            font-size: clamp(20px, 4.5vw, 28px);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .job-tags {
            display: flex; gap: 6px; flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .jtag {
            padding: 4px 11px;
            border-radius: var(--radius-pill);
            font-size: 11px; font-weight: 700;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            display: inline-flex; align-items: center;
        }
        .jtag.type { background: var(--brand-dim); border-color: rgba(249,115,22,0.35); color: #fb923c; }
        .jtag.salary { background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.3); color: #4ade80; }

        /* ── STORY TABS NAVIGATION ── */
        .story-tabs-nav {
            display: flex; gap: 6px;
            background: rgba(14, 14, 20, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 10px;
            width: fit-content;
            backdrop-filter: blur(14px);
        }
        .story-tab-btn {
            background: transparent; border: none;
            color: var(--text-muted);
            font-size: 11px; font-weight: 700;
            padding: 5px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .story-tab-btn:hover { color: #fff; }
        .story-tab-btn.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ── STORY PANELS ── */
        .story-panels-container {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 16px;
            backdrop-filter: blur(20px);
            min-height: 90px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .story-panel { display: none; }
        .story-panel.active { display: block; animation: panelFade 0.25s ease-out; }
        @keyframes panelFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .job-desc {
            font-size: 12.5px;
            color: rgba(255,255,255,0.78);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .job-date {
            font-size: 10.5px; font-weight: 600;
            color: rgba(255,255,255,0.45);
            margin-top: 8px;
            display: flex; align-items: center; gap: 4px;
        }

        /* Panel: Missions */
        .story-list {
            list-style: none;
            display: flex; flex-direction: column; gap: 6px;
        }
        .story-list li {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            display: flex; align-items: flex-start; gap: 8px;
            line-height: 1.4;
        }
        .story-list li i {
            width: 14px; height: 14px; color: var(--brand); flex-shrink: 0; margin-top: 2px;
        }

        /* Panel: Avantages */
        .perks-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
        }
        .perk-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 11.5px; font-weight: 600;
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.04);
            padding: 6px 10px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* Panel: Enquête Boîte (Reputation Links) */
        .reputation-links {
            display: flex; flex-direction: column; gap: 8px;
        }
        .reputation-title {
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--brand);
        }
        .rep-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
        }
        .rep-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 700;
            color: #fff; text-decoration: none;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .rep-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-1px);
        }
        .rep-btn i { width: 13px; height: 13px; flex-shrink: 0; }
        .rep-btn.wttj { border-color: rgba(255,221,0,0.3); color: #ffdd00; }
        .rep-btn.li { border-color: rgba(10,102,194,0.4); color: #38bdf8; }
        .rep-btn.indeed { border-color: rgba(33,100,244,0.4); color: #60a5fa; }
        .rep-btn.gd { border-color: rgba(12,168,77,0.4); color: #4ade80; }

        /* ── SIDEBAR ACTIONS (RIGHT) ── */
        .sidebar-actions {
            display: flex; flex-direction: column;
            gap: 16px; align-items: center;
            padding-bottom: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            cursor: pointer;
            background: none; border: none; padding: 0;
            color: #fff;
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: scale(1.1) translateY(-2px); }
        .action-btn:active { transform: scale(0.9); }

        .action-circle {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(16, 16, 22, 0.72);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: all 0.25s;
        }
        .action-circle.apply {
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 6px 22px var(--brand-glow);
        }
        .action-circle.saved {
            background: rgba(245,158,11,0.25);
            border-color: #f59e0b;
        }
        .action-circle.saved i { color: #f59e0b !important; }

        .action-label {
            font-size: 9.5px; font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.7);
        }

        /* Pulse */
        @keyframes pulse-brand {
            0%   { box-shadow: 0 0 0 0 var(--brand-glow); }
            70%  { box-shadow: 0 0 0 12px rgba(249,115,22,0); }
            100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); }
        }
        .pulse { animation: pulse-brand 2.4s infinite; }

        /* ── PROGRESS DOTS ── */
        .progress-dots {
            position: fixed;
            right: 8px; top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            display: flex; flex-direction: column; gap: 6px;
        }
        .progress-dot {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: all 0.25s;
            cursor: pointer;
        }
        .progress-dot.active {
            background: var(--brand);
            height: 18px;
            border-radius: 4px;
        }

        /* ── DESKTOP NAVIGATION ARROWS ── */
        .desktop-nav-arrows {
            position: fixed;
            right: 86px; bottom: 34px;
            z-index: 80;
            display: none;
            gap: 10px;
        }
        @media (min-width: 900px) {
            .desktop-nav-arrows { display: flex; }
        }
        .nav-arrow-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid var(--glass-border);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(14px);
            transition: all 0.2s;
        }
        .nav-arrow-btn:hover {
            background: var(--brand);
            border-color: var(--brand);
            transform: translateY(-2px);
        }

        /* ── EMPTY REEL ── */
        .empty-reel {
            height: 100dvh; width: 100vw;
            scroll-snap-align: start;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; padding: 32px; text-align: center;
        }
        .empty-reel h2 { font-size: 22px; font-weight: 800; }
        .empty-reel p { color: var(--text-muted); font-size: 13.5px; max-width: 420px; }
        .empty-reel a {
            background: var(--brand); color: #fff;
            padding: 12px 26px; border-radius: var(--radius-pill);
            text-decoration: none; font-weight: 700;
        }

        /* ── KEYBOARD TIP (DESKTOP) ── */
        .kbd-tip {
            position: fixed;
            left: 20px; bottom: 12px;
            z-index: 60;
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.3);
            display: none;
        }
        @media (min-width: 1024px) {
            .kbd-tip { display: block; }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">
        <div class="loader-ring"></div>
        <div class="loader-text">Chargement du flux Live…</div>
    </div>

    <!-- ── HEADER ── -->
    <header class="apex-header" id="apex-header">
        <a href="index.html" class="btn-header-round" aria-label="Retour à l'accueil APEX">
            <i data-lucide="arrow-left" style="width:18px;height:18px"></i>
        </a>

        <!-- Search Bar -->
        <div class="search-wrap">
            <div class="search-inner">
                <i data-lucide="search" class="search-icon" style="width:16px;height:16px"></i>
                <input
                    type="text"
                    id="swipe-search-input"
                    placeholder="Métier, restaurant, tech, ville…"
                    autocomplete="off"
                    oninput="window._swipeApp?.onSearchInput(this.value); toggleClear(this)"
                    onkeydown="if(event.key==='Enter'){window._swipeApp?.search();hideSuggest();}"
                >
                <button class="btn-clear" id="btn-clear" onclick="clearSearch()" aria-label="Effacer">
                    <i data-lucide="x" style="width:13px;height:13px"></i>
                </button>
                <button class="btn-search" onclick="window._swipeApp?.search()" aria-label="Rechercher">
                    <i data-lucide="arrow-right" style="width:14px;height:14px"></i>
                </button>
            </div>

            <!-- Autocomplete -->
            <div class="suggest-portal" id="suggest-portal">
                <div class="suggest-header">Suggestions rapides</div>
                <div id="suggest-list"></div>
            </div>
        </div>

        <!-- Sound Toggle -->
        <button class="btn-header-round" id="btn-sound-toggle" onclick="window._swipeApp?.toggleSound()" aria-label="Activer le son">
            <i data-lucide="volume-x" style="width:18px;height:18px"></i>
        </button>
    </header>

    <!-- ── FILTER CHIPS ── -->
    <div class="filter-row" id="filter-row">
        <button class="chip active" onclick="window._swipeApp?.setFilter(this,'')">🔥 Toutes les offres</button>
        <button class="chip" onclick="window._swipeApp?.setFilter(this,'CDI')">CDI</button>
        <button class="chip" onclick="window._swipeApp?.setFilter(this,'Alternance')">Alternance</button>
        <button class="chip" onclick="window._swipeApp?.setFilter(this,'Stage')">Stage</button>
        <button class="chip" onclick="window._swipeApp?.setFilter(this,'CDD')">CDD</button>
        <button class="chip" onclick="window._swipeApp?.selectSuggestion('restauration')">👨‍🍳 Restauration</button>
        <button class="chip" onclick="window._swipeApp?.selectSuggestion('développeur')">💻 Tech</button>
        <button class="chip" onclick="window._swipeApp?.selectSuggestion('santé')">🏥 Santé</button>
        <button class="chip" onclick="window._swipeApp?.selectSuggestion('commerce')">🛍️ Commerce</button>
    </div>

    <!-- ── REEL VIEWPORT ── -->
    <div id="reel-viewport"></div>

    <!-- Progress dots -->
    <div class="progress-dots" id="progress-dots"></div>

    <!-- Desktop Navigation Arrows -->
    <div class="desktop-nav-arrows">
        <button class="nav-arrow-btn" onclick="window._swipeApp?.scrollByUnits(-1)" aria-label="Offre précédente">
            <i data-lucide="chevron-up" style="width:20px;height:20px"></i>
        </button>
        <button class="nav-arrow-btn" onclick="window._swipeApp?.scrollByUnits(1)" aria-label="Offre suivante">
            <i data-lucide="chevron-down" style="width:20px;height:20px"></i>
        </button>
    </div>

    <!-- Desktop Keyboard Tip -->
    <div class="kbd-tip">Astuce : Naviguez avec les flèches ↑ ↓ ou la molette</div>

    <!-- Scripts -->
    <script src="js/core.js?v=10"></script>
    <script src="js/auth.js?v=10"></script>
    <script src="js/swipe-page.js?v=10"></script>
    <script>
        lucide.createIcons();

        // Canvas ambient particles
        (function() {
            const C = document.getElementById('bg-canvas');
            if (!C) return;
            const ctx = C.getContext('2d');
            let pts = [];

            function resize() { C.width = innerWidth; C.height = innerHeight; }
            addEventListener('resize', resize); resize();

            class Particle {
                constructor() { this.reset(true); }
                reset(anywhere) {
                    this.x = Math.random() * C.width;
                    this.y = anywhere ? Math.random() * C.height : C.height + 4;
                    this.vy = -(Math.random() * 0.4 + 0.08);
                    this.vx = (Math.random() - 0.5) * 0.12;
                    this.r  = Math.random() * 1.5 + 0.4;
                    this.a  = Math.random() * 0.45 + 0.1;
                }
                step() {
                    this.x += this.vx; this.y += this.vy;
                    if (this.y < -4) this.reset(false);
                }
                draw() {
                    ctx.fillStyle = `rgba(249,115,22,${this.a})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let i = 0; i < 50; i++) pts.push(new Particle());
            (function loop() {
                ctx.clearRect(0, 0, C.width, C.height);
                pts.forEach(p => { p.step(); p.draw(); });
                requestAnimationFrame(loop);
            })();
        })();

        function toggleClear(input) {
            document.getElementById('btn-clear')?.classList.toggle('visible', input.value.length > 0);
        }
        function clearSearch() {
            const inp = document.getElementById('swipe-search-input');
            if (inp) { inp.value = ''; inp.focus(); }
            document.getElementById('btn-clear')?.classList.remove('visible');
            hideSuggest();
        }
        function hideSuggest() {
            document.getElementById('suggest-portal')?.classList.remove('open');
        }
        document.addEventListener('click', e => {
            if (!e.target.closest('.search-wrap')) hideSuggest();
        });

        // Autocomplete dictionary
        const SUGGEST_POOL = [
            'Cuisinier / Chef', 'Commis de cuisine', 'Serveur / Barman', 'Pizzaïolo',
            'Développeur Fullstack', 'Développeur React / Vue', 'Développeur Python',
            'Développeur C# .NET', 'Ingénieur Cybersécurité', 'Data Analyst',
            'Infirmier DE', 'Aide-Soignant', 'Commercial B2B', 'Vendeur conseil',
            'Chef de chantier BTP', 'Électricien bâtiment', 'Responsable RH',
            'Comptable général', 'Alternance Informatique', 'Stage Marketing'
        ];

        window.SwipeAutocomplete = {
            show(query) {
                const portal = document.getElementById('suggest-portal');
                const list = document.getElementById('suggest-list');
                if (!portal || !list) return;
                if (!query || query.length < 2) { portal.classList.remove('open'); return; }

                const q = query.toLowerCase();
                const matches = SUGGEST_POOL.filter(s => s.toLowerCase().includes(q)).slice(0, 6);
                if (!matches.length) { portal.classList.remove('open'); return; }

                list.innerHTML = matches.map(m => {
                    const idx = m.toLowerCase().indexOf(q);
                    const hi = idx >= 0
                        ? m.slice(0, idx) + `<span class="match">${m.slice(idx, idx + q.length)}</span>` + m.slice(idx + q.length)
                        : m;
                    return `<div class="suggest-item" onclick="window._swipeApp?.selectSuggestion('${m.replace(/'/g,"\\'")}')">
                        <i data-lucide="search" style="width:13px;height:13px;color:var(--brand)"></i>
                        <span>${hi}</span>
                    </div>`;
                }).join('');

                portal.classList.add('open');
                lucide.createIcons();
            },
            hide() { document.getElementById('suggest-portal')?.classList.remove('open'); }
        };
    </script>
</body>
</html>
